services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_USER: nexora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - nexora-postgres-data:/var/lib/postgresql/data

volumes:
  nexora-postgres-data:
